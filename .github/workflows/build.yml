name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # 菜单图标校验：menu.json 引用了不存在的 icon-* 名称会直接失败，避免「图标失效」回归上线
  check-menu-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-menu-icons.mjs

  build:
    runs-on: ubuntu-latest # amd64，无 QEMU
    strategy:
      fail-fast: false # 两个镜像独立构建，一个失败不阻塞另一个
      matrix:
        include:
          - image: admin-server
            context: server
          - image: admin-client
            context: client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          tags: |
            ghcr.io/rob09527/${{ matrix.image }}:latest
            ghcr.io/rob09527/${{ matrix.image }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
