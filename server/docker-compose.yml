# 本地依赖环境（PostgreSQL + Redis）。
# 原官方模板是 MySQL，本项目已改用 PostgreSQL（与 forum server 共用），已替换。
# 启动：docker compose up -d
# 连接串示例（本机无密码开发环境）：postgresql://forum:forum@localhost:5432/forum
version: "3.1"

services:
  coolDB:
    image: postgres:16-alpine
    restart: always
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data/
    environment:
      TZ: Asia/Shanghai # 指定时区
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum # 业务库名
    networks:
      - cool
    ports:
      - 5432:5432

  coolRedis:
    image: redis
    #command: --requirepass "12345678" # redis库密码,不需要密码注释本行
    restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
    volumes:
      - ./data/redis/:/data/
    networks:
      - cool
    ports:
      - 6379:6379
